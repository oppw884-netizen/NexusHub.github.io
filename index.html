<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BObs Hub - Daily Key</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#05070b;
    --panel:#0d131b;
    --panel-2:#121a24;
    --line:#232e3d;
    --line-soft:#1a2330;
    --amber:#ffb454;
    --amber-2:#ff8a4d;
    --cyan:#5ee6c5;
    --paper:#eef1f6;
    --muted:#5f6b7a;
    --good:#5ee6a3;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Space Grotesk',sans-serif;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,180,84,0.06), transparent 45%),
      radial-gradient(circle at 80% 85%, rgba(94,230,197,0.05), transparent 45%),
      var(--ink);
    color:var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
    perspective:1200px;
  }

  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size:34px 34px;
    pointer-events:none;
  }

  .stage{
    position:relative;
    width:100%;
    max-width:400px;
  }

  .badge{
    position:relative;
    background:linear-gradient(165deg, var(--panel) 0%, var(--panel-2) 100%);
    border:1px solid var(--line);
    border-radius:20px;
    box-shadow:0 40px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.04);
    overflow:hidden;
    transform-style:preserve-3d;
    transition:transform 0.15s ease-out;
    will-change:transform;
  }

  /* holographic foil sheen, follows the tilt */
  .foil{
    position:absolute; inset:0;
    background:conic-gradient(from 0deg at 50% 50%,
      rgba(255,180,84,0.10), rgba(94,230,197,0.08), rgba(255,138,77,0.10),
      rgba(94,230,197,0.08), rgba(255,180,84,0.10));
    mix-blend-mode:screen;
    opacity:0.5;
    pointer-events:none;
    transition:opacity 0.2s ease;
    animation:foilspin 14s linear infinite;
  }
  @keyframes foilspin{
    to{ transform:rotate(360deg); }
  }

  /* faint scanline sweep */
  .scan{
    position:absolute; left:0; right:0; height:120px;
    background:linear-gradient(rgba(255,255,255,0) 0%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0) 100%);
    animation:scan 5s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes scan{
    0%{ top:-120px; }
    60%{ top:100%; }
    100%{ top:100%; }
  }

  .badge-top{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 22px 16px;
    border-bottom:1px dashed var(--line);
  }
  .brand{ display:flex; flex-direction:column; line-height:1.15; }
  .brand .name{
    font-weight:800;
    font-size:1.1rem;
    letter-spacing:0.2px;
    background:linear-gradient(90deg, var(--paper), var(--amber));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .brand .tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.62rem;
    color:var(--muted);
    letter-spacing:2px;
    text-transform:uppercase;
    margin-top:3px;
  }

  .serial{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.62rem;
    color:var(--muted);
    letter-spacing:1.5px;
    text-align:right;
  }
  .serial b{ color:var(--cyan); display:block; font-size:0.7rem; }

  .badge-body{ position:relative; padding:26px 22px 20px; }

  .field-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.62rem;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:12px;
    display:flex;
    justify-content:space-between;
  }
  .field-label .status{
    display:flex; align-items:center; gap:6px;
    color:var(--good);
  }
  .status .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--good);
    box-shadow:0 0 8px var(--good);
    animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.3;} }

  .key-row{ display:flex; align-items:center; gap:14px; }

  .ring-wrap{ position:relative; width:58px; height:58px; flex:none; }
  .ring-wrap svg{ transform:rotate(-90deg); }
  .ring-bg{ stroke:var(--line); fill:none; stroke-width:3.5; }
  .ring-tick{ stroke:var(--line-soft); stroke-width:1; }
  .ring-fg{
    stroke:url(#ringGrad);
    fill:none;
    stroke-width:3.5;
    stroke-linecap:round;
    transition:stroke-dashoffset 1s linear;
  }
  .ring-label{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:0.6rem;
    color:var(--amber);
  }

  .key-box{
    flex:1;
    background:#0a0f16;
    border:1px solid var(--line);
    border-radius:11px;
    padding:17px 15px;
    font-family:'IBM Plex Mono',monospace;
    font-size:1.2rem;
    font-weight:600;
    color:var(--amber);
    letter-spacing:2.5px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    position:relative;
    box-shadow:inset 0 2px 6px rgba(0,0,0,0.4);
  }
  .key-box::after{
    content:"";
    position:absolute; top:0; bottom:0; right:0; width:22px;
    background:linear-gradient(90deg, transparent, #0a0f16);
  }

  /* decorative barcode strip, generated from the key itself */
  .barcode{
    display:flex;
    align-items:flex-end;
    gap:2px;
    height:26px;
    margin-top:18px;
    opacity:0.55;
  }
  .barcode span{
    flex:1;
    background:var(--muted);
    border-radius:1px;
  }

  .meta-row{
    display:flex;
    justify-content:space-between;
    margin-top:14px;
    font-family:'IBM Plex Mono',monospace;
    font-size:0.66rem;
    color:var(--muted);
  }
  .meta-row b{ color:var(--paper); font-weight:600; }

  .perf{
    position:relative;
    height:0;
    border-top:1px dashed var(--line);
    margin:22px -22px 0;
  }
  .perf::before,.perf::after{
    content:""; position:absolute; top:-9px;
    width:18px; height:18px;
    background:var(--ink);
    border-radius:50%;
  }
  .perf::before{ left:-9px; }
  .perf::after{ right:-9px; }

  .badge-bottom{ position:relative; padding:22px 22px 26px; }

  button{
    width:100%;
    background:transparent;
    border:1px solid var(--amber-2);
    color:var(--amber);
    font-family:'IBM Plex Mono',monospace;
    font-size:0.85rem;
    font-weight:600;
    letter-spacing:1.5px;
    text-transform:uppercase;
    padding:15px 20px;
    border-radius:11px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:10px;
    transition:all 0.2s ease;
    position:relative;
    overflow:hidden;
  }
  button::before{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(90deg, transparent, rgba(255,180,84,0.15), transparent);
    transform:translateX(-100%);
    transition:transform 0.5s ease;
  }
  button:hover::before{ transform:translateX(100%); }
  button:hover{
    background:rgba(255,180,84,0.07);
    border-color:var(--amber);
    box-shadow:0 8px 22px rgba(255,138,77,0.15);
  }
  button:active{ transform:scale(0.98); }
  button:focus-visible{ outline:2px solid var(--amber); outline-offset:2px; }
  button.copied{ border-color:var(--good); color:var(--good); }

  .footnote{
    text-align:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:0.6rem;
    color:var(--muted);
    letter-spacing:0.5px;
    margin-top:16px;
  }

  @media (prefers-reduced-motion: reduce){
    .status .dot,.foil,.scan{ animation:none; }
    .badge{ transition:none; }
    .ring-fg{ transition:none; }
  }
</style>
</head>
<body>

  <div class="stage">
    <div class="badge" id="badge">
      <div class="foil" id="foil"></div>
      <div class="scan"></div>

      <div class="badge-top">
        <div class="brand">
          <span class="name">BObs Hub</span>
          <span class="tag">Access Control</span>
        </div>
        <div class="serial">
          NO.<b id="serialNo">----</b>
        </div>
      </div>

      <div class="badge-body">
        <div class="field-label">
          <span>Today's Key</span>
          <span class="status"><span class="dot"></span>Active</span>
        </div>
        <div class="key-row">
          <div class="ring-wrap">
            <svg width="58" height="58" viewBox="0 0 58 58">
              <defs>
                <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#ffb454"/>
                  <stop offset="100%" stop-color="#ff8a4d"/>
                </linearGradient>
              </defs>
              <circle class="ring-bg" cx="29" cy="29" r="24"></circle>
              <circle class="ring-fg" id="ringFg" cx="29" cy="29" r="24"
                stroke-dasharray="150.8" stroke-dashoffset="0"></circle>
            </svg>
            <div class="ring-label" id="ringLabel">--h</div>
          </div>
          <div class="key-box" id="keyDisplay">Generating…</div>
        </div>

        <div class="barcode" id="barcode"></div>

        <div class="meta-row">
          <span>Issued <b id="issuedDate">--</b></span>
          <span>Next key in <b id="countdownText">--:--:--</b></span>
        </div>
      </div>

      <div class="perf"></div>

      <div class="badge-bottom">
        <button id="copyBtn" onclick="copyKey()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <span id="btnText">Copy Key</span>
        </button>
        <div class="footnote">This key is valid for 24 hours from issue</div>
      </div>
    </div>
  </div>

<script>
  // ---------------- original key generation logic, unchanged ----------------
  const dateStr = new Date().toISOString().slice(0, 10).replace(/-/g, "");
  let seed = parseInt(dateStr);

  function seededRandom() {
    seed = (seed * 1103515245 + 12345) % 2147483648;
    return seed;
  }

  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
  let keyStr = "";
  for (let i = 0; i < 10; i++) {
    let r = seededRandom() % chars.length;
    keyStr += chars.substring(r, r + 1);
  }

  const finalKey = "BObs - " + keyStr;
  // ---------------------------------------------------------------------------

  const keyDisplay = document.getElementById("keyDisplay");

  // scramble-in reveal before settling on the real key
  function scrambleIn(el, target, duration = 700) {
    const steps = 14;
    let frame = 0;
    const iv = setInterval(() => {
      frame++;
      let out = "";
      for (let i = 0; i < target.length; i++) {
        const ch = target[i];
        if (ch === " " || ch === "-" ) { out += ch; continue; }
        const reveal = frame / steps > i / target.length;
        out += reveal ? ch : chars[Math.floor(Math.random() * chars.length)];
      }
      el.innerText = out;
      if (frame >= steps) {
        clearInterval(iv);
        el.innerText = target;
      }
    }, duration / steps);
  }
  scrambleIn(keyDisplay, finalKey);

  // serial number derived from the date, cosmetic only
  document.getElementById("serialNo").innerText = dateStr.slice(-4);

  const d = new Date();
  document.getElementById("issuedDate").innerText =
    d.toLocaleDateString(undefined, { month: "short", day: "numeric" });

  // decorative barcode, bar widths derived deterministically from the key
  const barcodeEl = document.getElementById("barcode");
  for (let i = 0; i < 40; i++) {
    const code = keyStr.charCodeAt(i % keyStr.length) + i;
    const bar = document.createElement("span");
    bar.style.height = (30 + (code % 70)) + "%";
    bar.style.opacity = 0.3 + (code % 10) / 14;
    barcodeEl.appendChild(bar);
  }

  // countdown: fraction of the day remaining until local midnight, ticks every second
  const ringFg = document.getElementById("ringFg");
  const ringLabel = document.getElementById("ringLabel");
  const countdownText = document.getElementById("countdownText");
  const CIRC = 150.8;

  function pad(n) { return String(n).padStart(2, "0"); }

  function updateCountdown() {
    const now = new Date();
    const msLeft = (24 * 60 * 60 * 1000) - (
      now.getHours() * 3600000 + now.getMinutes() * 60000 + now.getSeconds() * 1000
    );
    const hoursLeft = msLeft / 3600000;
    const frac = hoursLeft / 24;
    ringFg.setAttribute("stroke-dashoffset", (CIRC * (1 - frac)).toFixed(1));
    ringLabel.innerText = Math.ceil(hoursLeft) + "h";

    const totalSec = Math.max(0, Math.floor(msLeft / 1000));
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    countdownText.innerText = `${pad(h)}:${pad(m)}:${pad(s)}`;
  }
  updateCountdown();
  setInterval(updateCountdown, 1000);

  // subtle 3D tilt toward the pointer, badge-under-glass feel
  const badge = document.getElementById("badge");
  const stage = document.querySelector(".stage");
  const prefersReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function tiltFromPoint(clientX, clientY) {
    const r = stage.getBoundingClientRect();
    const x = (clientX - r.left) / r.width - 0.5;
    const y = (clientY - r.top) / r.height - 0.5;
    badge.style.transform = `rotateY(${x * 10}deg) rotateX(${-y * 10}deg)`;
  }
  function resetTilt() {
    badge.style.transform = "rotateY(0deg) rotateX(0deg)";
  }

  if (!prefersReduced) {
    // desktop: follow the mouse
    stage.addEventListener("mousemove", (e) => tiltFromPoint(e.clientX, e.clientY));
    stage.addEventListener("mouseleave", resetTilt);

    // mobile: follow the finger while dragging on the card, reset on release
    stage.addEventListener("touchmove", (e) => {
      if (e.touches.length) tiltFromPoint(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    stage.addEventListener("touchend", resetTilt);
  }

  function showCopied() {
    const btn = document.getElementById("copyBtn");
    const btnText = document.getElementById("btnText");
    btnText.innerText = "Copied";
    btn.classList.add("copied");
    setTimeout(() => {
      btnText.innerText = "Copy Key";
      btn.classList.remove("copied");
    }, 2000);
  }

  function legacyCopy(text) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  function copyKey() {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(finalKey).then(showCopied).catch(() => {
        if (legacyCopy(finalKey)) showCopied();
        else alert("Failed to copy. Please copy manually.");
      });
    } else {
      if (legacyCopy(finalKey)) showCopied();
      else alert("Failed to copy. Please copy manually.");
    }
  }
</script>
</body>
</html>
