<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BOb HUB — Cyber Script Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:        #f3f6fc;
    --surface:   #ffffff;
    --border:    #e6ebf5;
    --blue:      #2f6bff;
    --blue-2:    #22c1f0;
    --ink:       #0f1728;
    --muted:     #7a8399;
    --pill-bg:   #eef3ff;
    --success:   #16c784;
    --star:      #f5b301;
    --skeleton:  #e2e8f0;
    --skeleton-shine: #f8fafc;
  }

  html[data-theme="dark"]{
    --bg:        #0b0f19;
    --surface:   #141a29;
    --border:    #232b3d;
    --blue:      #4a7dff;
    --blue-2:    #22c1f0;
    --ink:       #eef1f8;
    --muted:     #8b93a7;
    --pill-bg:   #1b2233;
    --success:   #1fd68f;
    --star:      #ffcc33;
    --skeleton:  #1e293b;
    --skeleton-shine: #334155;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; scroll-behavior: smooth; }
  body{
    -webkit-user-select:none; user-select:none;
    background:var(--bg);
    color:var(--ink);
    font-family:'Prompt', sans-serif;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
    transition:background .3s ease, color .3s ease;
  }

  .deco-dot{ position:absolute; width:5px; height:5px; border-radius:50%; background:#c7d3ec; }
  .deco-line{ position:absolute; background:#d7e0f2; height:1px; transform-origin:left; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 34px; background:var(--surface); border-bottom:1px solid var(--border);
    position:relative; z-index:5;
  }
  
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{
    width:42px; height:42px; border-radius:12px; flex-shrink:0;
    background:linear-gradient(135deg, var(--blue), var(--blue-2));
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 16px rgba(47,107,255,.35);
  }
  .brand-text{ display:flex; flex-direction:column; line-height:1.15; }
  .brand-text .name{ font-weight:800; font-size:19px; letter-spacing:.5px; }
  .brand-text .name .accent{ color:var(--blue); }
  .brand-text .port{ font-size:10.5px; color:var(--blue); font-weight:600; letter-spacing:1px; }

  .nav-pill{
    display:flex; align-items:center; gap:4px; background:var(--pill-bg);
    border-radius:999px; padding:5px; border:1px solid var(--border);
  }
  .nav-item{
    display:flex; align-items:center; gap:7px; padding:9px 18px; border-radius:999px;
    font-size:13.5px; font-weight:600; color:var(--ink); cursor:pointer; white-space:nowrap;
    background:transparent; border:none; font-family:'Prompt',sans-serif;
  }
  .nav-item.active{
    background:linear-gradient(90deg, var(--blue), var(--blue-2)); color:#fff;
    box-shadow:0 6px 14px rgba(47,107,255,.35);
  }

  .topbar-actions{ display:flex; align-items:center; gap:10px; }

  .btn-theme{
    width:40px; height:40px; border-radius:12px; border:1px solid var(--border);
    background:var(--pill-bg); color:var(--ink); cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    transition:background .2s ease, transform .2s ease;
  }
  .btn-theme:hover{ transform:translateY(-2px); }
  .btn-theme svg{ width:19px; height:19px; }
  .btn-theme .icon-sun{ display:none; }
  html[data-theme="dark"] .btn-theme .icon-moon{ display:none; }
  html[data-theme="dark"] .btn-theme .icon-sun{ display:block; }

  .btn-bookmark{
    position:absolute; top:10px; left:10px; width:32px; height:32px; border-radius:9px;
    background:rgba(255,255,255,.92); border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:transform .2s ease, background .2s ease; z-index:2;
  }
  html[data-theme="dark"] .btn-bookmark{ background:rgba(20,26,41,.85); }
  .btn-bookmark:hover{ transform:scale(1.1); }
  .btn-bookmark svg{ width:16px; height:16px; stroke:var(--muted); fill:none; transition:fill .2s ease, stroke .2s ease; }
  .btn-bookmark.active svg{ fill:var(--star); stroke:var(--star); }
  .thumb .thumb-tag{ left:48px; }

  .hero{ position:relative; text-align:center; padding:56px 20px 30px; z-index:2; }
  .kicker{
    display:inline-flex; align-items:center; gap:7px; padding:7px 16px; border-radius:999px;
    background:var(--pill-bg); color:var(--blue); font-size:12px; font-weight:700;
    letter-spacing:1px; border:1px solid #d8e4ff; margin-bottom:20px;
    cursor: pointer; transition: all 0.2s ease;
  }
  .kicker .dot{ width:6px; height:6px; border-radius:50%; background:var(--blue); }
  h1{ font-size:38px; font-weight:800; margin:0 0 14px; line-height:1.25; }
  h1 .hl{ color:var(--blue); }
  .hero p{ color:var(--muted); font-size:14.5px; font-weight:500; max-width:520px; margin:0 auto; }

  .stats{
    display:flex; gap:18px; justify-content:center; flex-wrap:wrap;
    max-width:900px; margin:34px auto 0; padding:0 20px; position:relative; z-index:2;
  }
  .stat-card{
    flex:1; min-width:220px; display:flex; align-items:center; gap:14px;
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:16px 20px; box-shadow:0 8px 24px rgba(16,24,40,.04);
  }
  .stat-icon{
    width:42px; height:42px; border-radius:11px; display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .stat-icon svg{ width:20px; height:20px; }
  .stat-icon.blue{ background:#e8f0ff; color:var(--blue); }
  .stat-icon.cyan{ background:#e4f9fb; color:#12b3c9; }
  .stat-icon.violet{ background:#eee9fd; color:#7c5cff; }
  .stat-label{ display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted); font-weight:600; }
  .stat-label .live{ width:7px; height:7px; border-radius:50%; background:var(--success); }
  .stat-num{ font-size:22px; font-weight:800; font-family:'JetBrains Mono', monospace; }

  .search-wrap{ max-width:820px; margin:26px auto 20px; padding:0 20px; position:relative; z-index:2; }
  .search-bar{
    display:flex; align-items:center; gap:12px; background:var(--surface);
    border:1px solid var(--border); border-radius:16px; padding:15px 22px;
    box-shadow:0 8px 24px rgba(16,24,40,.05);
  }
  .search-bar svg{ width:18px; height:18px; color:var(--muted); flex-shrink:0; }
  .search-bar input{
    border:none; outline:none; flex:1; font-family:'Prompt',sans-serif; font-size:14px;
    background:transparent; color:var(--ink);
  }
  
  /* Filter Tags */
  .filter-wrap {
    display: flex; gap: 8px; margin-top: 15px; overflow-x: auto; padding-bottom: 10px; max-width: 820px; margin-inline: auto; padding-inline: 20px;
  }
  .filter-wrap::-webkit-scrollbar { display: none; }
  .filter-btn { border-color: var(--border); background: var(--surface); color: var(--muted); margin-bottom: 0; }
  .filter-btn:hover { background: var(--pill-bg); color: var(--blue); }
  .filter-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }

  .grid{
    max-width:960px; margin:0 auto; padding:0 20px 60px; position:relative; z-index:2;
    display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:22px;
  }

  .script-card{
    background:var(--surface); border:1px solid var(--border); border-radius:18px; overflow:hidden;
    box-shadow:0 10px 28px rgba(16,24,40,.05); display:flex; flex-direction:column;
    transition:transform .25s ease, box-shadow .25s ease; scroll-margin-top: 100px;
  }
  .script-card.highlight {
    animation: highlightCard 2s ease forwards;
  }

  .thumb{
    position:relative; height:170px; background:linear-gradient(135deg, var(--blue), #9b5cff, var(--blue-2));
    overflow:hidden;
  }
  .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .thumb-tag{
    position:absolute; top:10px; left:10px; background:rgba(255,255,255,.92); color:#0f1728;
    font-size:10.5px; font-weight:700; padding:5px 10px; border-radius:8px;
    max-width:calc(100% - 92px); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .thumb-partner{
    position:absolute; top:10px; right:10px; display:flex; align-items:center; gap:4px;
    background:var(--blue); color:#fff; font-size:10.5px; font-weight:700; padding:5px 10px; border-radius:8px;
  }

  .card-body{ padding:16px 18px 18px; display:flex; flex-direction:column; gap:12px; }
  .script-title{ font-size:17px; font-weight:700; }
  .author-row{ display:flex; align-items:center; gap:8px; }
  .author-avatar{
    width:22px; height:22px; border-radius:50%; background:var(--pill-bg);
    display:flex; align-items:center; justify-content:center; font-size:11px; flex-shrink:0;
  }
  .author-name{ font-size:12.5px; color:var(--muted); font-weight:600; }

  /* Action Buttons Row */
  .action-row { display: flex; gap: 8px; }
  .btn-copy{
    flex: 1; display:flex; align-items:center; justify-content:center; gap:8px; padding:13px;
    border:none; border-radius:12px; font-family:'Prompt',sans-serif; font-weight:700; font-size:13.5px;
    color:#fff; background:linear-gradient(90deg, var(--blue), var(--blue-2)); cursor:pointer;
    box-shadow:0 8px 18px rgba(47,107,255,.28); transition:transform .15s ease, filter .15s ease;
  }
  .btn-copy:hover{ transform:translateY(-2px); filter:brightness(1.06); }
  .btn-copy svg{ width:15px; height:15px; }

  .btn-share {
    display:flex; align-items:center; justify-content:center; padding:13px; width:45px;
    border:1px solid var(--border); border-radius:12px; background:var(--pill-bg); color:var(--ink);
    cursor:pointer; transition:transform .15s ease; flex-shrink: 0;
  }
  .btn-share:hover { transform:translateY(-2px); background:var(--border); }
  .btn-share svg { width: 16px; height: 16px; }

  .btn-discord{ background:linear-gradient(90deg, #5865F2, #7c5cff); box-shadow:0 8px 18px rgba(88,101,242,.28); }

  .script-card.locked{
    align-items:center; justify-content:center; min-height:170px; border:1.5px dashed #d5deee;
    box-shadow:none; background:#fafbfe;
  }
  .locked-inner{ display:flex; flex-direction:column; align-items:center; gap:8px; padding:30px 20px; color:var(--muted); }
  
  /* Skeleton Loading Styles */
  .skeleton {
    background: linear-gradient(90deg, var(--skeleton) 25%, var(--skeleton-shine) 50%, var(--skeleton) 75%);
    background-size: 200% 100%;
    animation: skeletonShimmer 1.5s infinite;
    border-radius: 8px;
  }
  .skel-img { height: 170px; border-radius: 18px 18px 0 0; }
  .skel-title { height: 24px; width: 80%; margin-bottom: 8px; }
  .skel-avatar { width: 22px; height: 22px; border-radius: 50%; }
  .skel-author { height: 16px; width: 40%; }
  .skel-btn { height: 45px; width: 100%; border-radius: 12px; margin-top: 12px; }

  .toast{
    position:fixed; top:20px; left:50%; transform:translate(-50%,-100px);
    background:var(--ink); color:#fff; padding:14px 26px; border-radius:16px;
    font-weight:500; font-size:13px; z-index:9999; opacity:0;
    transition:transform .3s ease, opacity .3s ease; box-shadow:0 10px 24px rgba(0,0,0,.25);
    text-align: center; line-height: 1.5; min-width: 280px;
  }
  .toast.show{ transform:translate(-50%,0); opacity:1; }

  .view{ display:none; }
  .view.active{ display:block; }
  .partner-grid { max-width:960px; margin:0 auto; padding:10px 20px 70px; display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:22px;}
  .empty-msg { grid-column:1/-1; text-align:center; color:var(--muted); font-size:14px; padding:40px 0; }

  @media (max-width:760px){
    .nav-pill{ display:none; }
    .topbar{ padding:14px 18px; }
    h1{ font-size:27px; }
  }

  @keyframes fadeUp{ from{ opacity:0; transform:translateY(18px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes skeletonShimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  @keyframes popIn{ 0%{ opacity:0; transform:translate(-50%,-130px) scale(.9); } 100%{ opacity:1; transform:translate(-50%,0) scale(1); } }
  @keyframes highlightCard { 0% { box-shadow: 0 0 0 4px var(--blue); transform: scale(1.02); } 100% { box-shadow: 0 10px 28px rgba(16,24,40,.05); transform: scale(1); } }

  body{ animation:fadeIn .5s ease both; }
  .script-card:hover{ transform:translateY(-6px); box-shadow:0 18px 36px rgba(16,24,40,.10); }
  .script-card:hover .thumb img{ transform:scale(1.06); }
  .thumb img{ transition:transform .4s ease; }
</style>
</head>
<body>

  <header class="topbar">
    <div class="brand">

        <img src="https://raw.githubusercontent.com/oppw884-netizen/Nexus-Hub/refs/heads/main/download.jpe" style="width: 100%; height: 100%; border-radius: 12px; object-fit: cover;" alt="Logo">

  <section class="hero">

  <div class="stats">
    <div class="stat-card">
      <div class="stat-icon blue"><svg viewBox="0 0 24 24" fill="none"><path d="M17 20v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2M15 4.2a4 4 0 0 1 0 7.6M21 20v-2a4 4 0 0 0-3-3.87" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="9" cy="8" r="4" stroke="currentColor" stroke-width="1.8"/></svg></div>
      <div><div class="stat-label"><span class="live"></span> ออนไลน์อยู่</div><div class="stat-num" id="statOnline">1</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon cyan"><svg viewBox="0 0 24 24" fill="none"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/></svg></div>
      <div><div class="stat-label">เข้าชมทั้งหมด</div><div class="stat-num" id="statViews">1</div></div>

      <div class="stat-icon violet"><svg viewBox="0 0 24 24" fill="none"><path d="M4 4h11l5 5v11H4V4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M15 4v5h5" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></div>
      <div><div class="stat-label">สคริปต์ทั้งหมด</div><div class="stat-num" id="statScripts">2</div></div>

  <div id="viewScripts" class="view active">

        <input type="text" placeholder="ค้นหาชื่อเกม, ชื่อสคริปต์ หรือชื่อผู้พัฒนา..." id="searchInput">

    <!-- Filter Tags -->
    <div class="filter-wrap" id="filterContainer">

      <button class="kicker filter-btn" onclick="applyFilter('speed', this)">⚡ ความเร็ว (Speed)</button>

    <div class="grid" id="favoritesContainer" style="padding-bottom:60px;"></div>

  <div id="viewRecent" class="view">

      <h2 style="font-size:26px; font-weight:800; margin:0 0 10px;">🕒 ดูล่าสุด</h2>
      <p style="color:var(--muted); font-size:14px;">ประวัติสคริปต์ที่คุณเพิ่งคัดลอกหรือกดแชร์</p>
    </section>

  <div id="viewPartners" class="view">

      <!-- พาร์ทเนอร์ -->

        <div style="width:88px; height:88px; border-radius:16px; margin:0 auto 12px; display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:800; color:#fff; background:linear-gradient(135deg, var(--blue), var(--blue-2));">BOB</div>

  <div class="toast" id="toastBox"></div>

<script>
  // 1. Data[cite: 1] - เพิ่ม Category เข้าไปเพื่อใช้กรอง
  const scriptsData = {
    1: { type:"script", category:"escape", tag:"+1 Speed Keyboard: Escape the Backrooms", title:"+1 Speed Keyboard: Escape the Backrooms", author:"bob", code:`loadstring(game:HttpGet("https://raw.githubusercontent.com/oppw884-netizen/Nexus-Hub/refs/heads/main/%2B1%20Speed%20Keyboard%3A%20Escape%20the%20Backrooms.Lua"))()`, img:"https://tr.rbxcdn.com/180DAY-341b524768671042b4cd19d5fef00151/768/432/Image/Webp/noFilter" },
    2: { type:"script", category:"speed", tag:"+1 Speed Moonwalk Escape🌙", title:"+1 Speed Moonwalk Escape🌙", author:"bob", code:`loadstring(game:HttpGet("https://raw.githubusercontent.com/oppw884-netizen/Nexus-Hub/refs/heads/main/%2B1%20Speed%20Moonwalk%20Escape.Lua"))()`, img:"https://tr.rbxcdn.com/180DAY-2f74ce9a6075079747459b8eaad881c2/768/432/Image/Webp/noFilter" },
  };
  const totalRealScripts = Object.keys(scriptsData).length;
  const totalSlots = 20; 

  // ระบบ Theme
  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
  }

  // ระบบ Favorites และ Recent
  function getList(key) { try { return JSON.parse(localStorage.getItem(key)) || []; } catch(e) { return []; } }
  function saveList(key, list) { try { localStorage.setItem(key, JSON.stringify(list)); } catch(e){} }
  
  function toggleFavorite(id, btnEl) {
    let list = getList('nx_fav');
    const active = list.includes(id);
    if (active) list = list.filter(x => x !== id); else list.push(id);
    saveList('nx_fav', list);
    if (btnEl) btnEl.classList.toggle('active', !active);
    showToast(active ? '💔 นำออกจากรายการโปรดแล้ว' : '⭐ บันทึกลงรายการโปรดแล้ว!');
    renderSpecialList('nx_fav', 'favoritesContainer', 'ยังไม่มีรายการโปรด');
  }

  function addRecent(id) {
    let list = getList('nx_recent');
    list = list.filter(x => x !== id); // Remove duplicate
    list.unshift(id); // Add to top
    if(list.length > 20) list.pop(); // Max 20
    saveList('nx_recent', list);
    renderSpecialList('nx_recent', 'recentContainer', 'ยังไม่มีประวัติการเข้าชม');
  }

  function showToast(htmlMsg) {
    const t = document.getElementById('toastBox');
    t.innerHTML = htmlMsg;
    t.classList.remove('show'); void t.offsetWidth;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3500);
  }

  // คัดลอก & แจ้งเตือนแบบละเอียด
  function doCopy(id){
    navigator.clipboard.writeText(scriptsData[id].code).then(() => {
      addRecent(id);
      showToast(`
        <span style="font-size:15px;">📋 คัดลอกสำเร็จ!</span><br>
        <span style="color:var(--blue-2); font-weight:700;">${scriptsData[id].title}</span><br>
        <span style="font-size:11px; font-weight:400; opacity:0.8;">(สคริปต์นี้เป็น 1 ใน ${totalRealScripts} สคริปต์ของระบบ)</span>
      `);
    });
  }

  // แชร์ลิงก์
  function shareScript(id) {
    addRecent(id);
    const url = window.location.origin + window.location.pathname + "?script=" + id;
    navigator.clipboard.writeText(url).then(() => {
      showToast(`🔗 คัดลอกลิงก์แชร์แล้ว!<br><span style="font-size:11px; font-weight:400;">ส่งให้เพื่อน เมื่อเปิดลิงก์จะเลื่อนมาที่สคริปต์นี้ทันที</span>`);
    });
  }

  // สร้าง HTML ของการ์ด
  function generateCardHTML(id, data, isLocked = false) {
    if (isLocked) {
      return `<div class="script-card locked"><div class="locked-inner"><div class="n">#${String(id).padStart(2,'0')}</div><div class="t">⏳ รออัปเดต...</div></div></div>`;
    }
    const favActive = getList('nx_fav').includes(id) ? ' active' : '';
    const btnFav = `<button class="btn-bookmark${favActive}" onclick="event.stopPropagation(); toggleFavorite(${id}, this)"><svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.2 1 5.9-5.2-2.8-5.2 2.8 1-5.9-4.3-4.2 5.9-.8L12 3.5Z"/></svg></button>`;
    
    return `
      <div class="script-card" id="script-card-${id}" data-cat="${data.category || 'other'}" data-title="${data.title.toLowerCase()}">
        <div class="thumb">
          <img src="${data.img}">
          ${btnFav}
          <div class="thumb-tag">${data.tag || 'สคริปต์'}</div>
        </div>
        <div class="card-body">
          <div class="script-title">${data.title}</div>
          <div class="author-row"><div class="author-avatar">🎮</div><div class="author-name">${data.author}</div></div>
          <div class="action-row">
            <button class="btn-copy" onclick="doCopy(${id})"><svg viewBox="0 0 24 24" fill="none"><rect x="9" y="9" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M5 15V5a2 2 0 0 1 2-2h10" stroke="currentColor" stroke-width="1.8"/></svg> คัดลอก</button>
            <button class="btn-share" onclick="shareScript(${id})" title="แชร์สคริปต์นี้"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg></button>
          </div>
        </div>
      </div>`;
  }

  // Skeleton Loader
  function renderSkeletons() {
    const c = document.getElementById('hubContainer');
    c.innerHTML = '';
    for(let i=0; i<6; i++) {
      c.innerHTML += `
        <div class="script-card">
          <div class="skeleton skel-img"></div>
          <div class="card-body">
            <div class="skeleton skel-title"></div>
            <div class="author-row"><div class="skeleton skel-avatar"></div><div class="skeleton skel-author"></div></div>
            <div class="skeleton skel-btn"></div>
          </div>
        </div>`;
    }
  }

  // Render ข้อมูลจริง
  function renderScripts() {
    const c = document.getElementById('hubContainer');
    c.innerHTML = '';
    for (let i = 1; i <= totalSlots; i++) {
      c.innerHTML += generateCardHTML(i, scriptsData[i], !scriptsData[i]);
    }
    document.getElementById('statScripts').textContent = totalRealScripts;
    
    // Check Deep Link (Share URL)
    const urlParams = new URLSearchParams(window.location.search);
    const targetId = urlParams.get('script');
    if(targetId && scriptsData[targetId]) {
      setTimeout(() => {
        const el = document.getElementById(`script-card-${targetId}`);
        if(el) {
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          el.classList.add('highlight');
          setTimeout(() => el.classList.remove('highlight'), 2500);
        }
      }, 500);
    }
  }

  function renderSpecialList(storageKey, containerId, emptyMsg) {
    const c = document.getElementById(containerId);
    if(!c) return;
    const ids = getList(storageKey);
    c.innerHTML = '';
    if(ids.length === 0) { c.innerHTML = `<div class="empty-msg">${emptyMsg}</div>`; return; }
    ids.forEach(id => { if(scriptsData[id]) c.innerHTML += generateCardHTML(id, scriptsData[id]); });
  }

  // ระบบ Filter & Search
  function applyFilter(cat, btnEl) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btnEl.classList.add('active');
    filterCards();
  }

  document.getElementById('searchInput').addEventListener('input', filterCards);

  function filterCards() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    const activeCat = document.querySelector('.filter-btn.active').innerText;
    let catCode = 'all';
    if(activeCat.includes('Speed')) catCode = 'speed';
    else if(activeCat.includes('Auto')) catCode = 'auto';
    else if(activeCat.includes('Escape')) catCode = 'escape';
    else if(activeCat.includes('อื่น')) catCode = 'other';

    document.querySelectorAll('#hubContainer .script-card').forEach(card => {
      if(card.classList.contains('locked')) { card.style.display = (catCode === 'all' && q === '') ? '' : 'none'; return; }
      const matchText = card.getAttribute('data-title').includes(q);
      const matchCat = (catCode === 'all' || card.getAttribute('data-cat') === catCode);
      card.style.display = (matchText && matchCat) ? '' : 'none';
    });
  }

  // แท็บเมนู
  function switchTab(viewName) {
    ['Scripts', 'Favorites', 'Recent', 'Partners'].forEach(v => {
      document.getElementById('view' + v).classList.remove('active');
      const btn = document.getElementById('btnTab' + v);
      if(btn) btn.classList.remove('active');
    });
    
    document.getElementById('view' + viewName.charAt(0).toUpperCase() + viewName.slice(1)).classList.add('active');
    document.getElementById('btnTab' + viewName.charAt(0).toUpperCase() + viewName.slice(1)).classList.add('active');
    
    if(viewName === 'favorites') renderSpecialList('nx_fav', 'favoritesContainer', 'ยังไม่มีรายการโปรด');
    if(viewName === 'recent') renderSpecialList('nx_recent', 'recentContainer', 'ยังไม่มีประวัติการเข้าชม');
  }

  // On Load
  window.onload = () => {
    document.documentElement.setAttribute('data-theme', window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    renderSkeletons(); // โชว์โครงร่างก่อน
    setTimeout(renderScripts, 1500); // ดีเลย์ 1.5 วิ แล้วโชว์ของจริง
  };
</script>
</body>
</html>
